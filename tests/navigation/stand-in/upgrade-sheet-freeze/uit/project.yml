name: VProbe
options:
  bundleIdPrefix: com.scratch.vprobe
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  VProbeHost:
    type: application
    platform: iOS
    sources: [Host]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.scratch.vprobe.host
  VProbeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: VProbeHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scratch.vprobe.uitests
        TEST_TARGET_NAME: VProbeHost
        GENERATE_INFOPLIST_FILE: YES
schemes:
  VProbeUITests:
    build:
      targets:
        VProbeHost: all
        VProbeUITests: [test]
    test:
      targets: [VProbeUITests]
