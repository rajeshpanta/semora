name: VTab
options:
  bundleIdPrefix: com.scratch.vtab
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  VTabHost:
    type: application
    platform: iOS
    sources: [Host]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.scratch.vtab.host
  VTabUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: VTabHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scratch.vtab.uitests
        TEST_TARGET_NAME: VTabHost
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_BRIDGING_HEADER: UITests/Bridge.h
schemes:
  VTabUITests:
    build:
      targets:
        VTabHost: all
        VTabUITests: [test]
    test:
      targets: [VTabUITests]
