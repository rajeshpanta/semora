# Does the website still describe the app we actually ship?
#
# The website and the app share zero code — different frameworks, separate
# package.json, separate node_modules — so every number on semoraai.com is a
# hand-typed restatement of a constant in lib/. scripts/check-product-facts.mjs
# reads the app's constants and fails when the site contradicts them.
#
# That script has existed for a while and passed the whole time the site was
# advertising four free courses against a product that allows one: it only ever
# read website/lib/semora-facts.ts, and the false claims were in the long-form
# content registries. It now reads those too, and this workflow is what makes it
# run without anyone remembering to.
#
# WHY THIS MATTERS ON PUSH AND NOT ONLY ON PR: the website auto-deploys from
# `main`. A failing check here does not block that deploy — it is a smoke alarm,
# not a gate — so a red run means "the live site is wrong, go fix it now".
#
# Zero dependencies and no secrets: the script is Node stdlib only and reads
# files out of the checkout, so this needs no install step and cannot leak
# anything.
#
# RUN IT LOCALLY WITH `node scripts/check-product-facts.mjs`, and please do not
# add an npm alias for it back into package.json. app.json pins
# `runtimeVersion: {policy: 'fingerprint'}`, and package.json is one of the
# inputs eas-cli hashes to compute that runtime — so a one-line script entry
# here changed the shipped app's runtime from e88b9845 to cb5d767f and sent an
# OTA into a mailbox no installed build reads. A developer convenience is not
# worth an unreachable release. CI calls the script directly, which is why this
# workflow never needed the alias in the first place.

name: product-facts

on:
  push:
    branches: [main]
    paths:
      - 'website/lib/**'
      # The price check walks website/app as well — blog posts and the keyword
      # landers quote prices too, and without this a stale price edited in an
      # .mdx file would never trigger the guard that exists to catch it.
      - 'website/app/**'
      # The guard now also checks the APP's price fallbacks and its "Save N%"
      # claims against the website's PRICING, so it has to run when those move.
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'supabase/functions/_shared/stripe.ts'
      - 'supabase/functions/_shared/stripe-prices.ts'
      - 'supabase/functions/_shared/stripe.test.ts'
      # The App Store listing copy is checked now too.
      - 'store.config.json'
      - 'app.json'
      # Served at semoraai.com/llms.txt, and the SEO archive behind it.
      - 'website/public/llms.txt'
      - 'marketing-pages/**'
      - 'scripts/check-product-facts.mjs'
      - '.github/workflows/product-facts.yml'
  pull_request:
    paths:
      - 'website/lib/**'
      # The price check walks website/app as well — blog posts and the keyword
      # landers quote prices too, and without this a stale price edited in an
      # .mdx file would never trigger the guard that exists to catch it.
      - 'website/app/**'
      # The guard now also checks the APP's price fallbacks and its "Save N%"
      # claims against the website's PRICING, so it has to run when those move.
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'supabase/functions/_shared/stripe.ts'
      - 'supabase/functions/_shared/stripe-prices.ts'
      - 'supabase/functions/_shared/stripe.test.ts'
      # The App Store listing copy is checked now too.
      - 'store.config.json'
      - 'app.json'
      # Served at semoraai.com/llms.txt, and the SEO archive behind it.
      - 'website/public/llms.txt'
      - 'marketing-pages/**'
      - 'scripts/check-product-facts.mjs'
      - '.github/workflows/product-facts.yml'
  workflow_dispatch:

concurrency:
  group: product-facts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check the site against the app's constants
        run: node scripts/check-product-facts.mjs

      # planForPrice must keep resolving prices we no longer sell, or a
      # grandfathered subscriber's renewal writes a null plan and the app
      # shows a paying customer the upgrade rows. Deno is used because the
      # edge functions are Deno, not Node.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Stripe price mapping still honours legacy prices
        run: deno test --allow-env supabase/functions/_shared/stripe.test.ts
