<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#6B46C1" />
    <meta name="application-name" content="Semora" />
    <meta
      name="description"
      content="Turn syllabi into an organized semester with deadlines, grades, study plans, flashcards, and focus tools."
    />
    <meta property="og:title" content="Semora · Your semester, organized" />
    <meta
      property="og:description"
      content="Scan a syllabus and turn every deadline into a plan."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Semora · Your semester, organized" />
    <meta
      name="twitter:description"
      content="Scan a syllabus and turn every deadline into a plan."
    />
    <meta name="twitter:image" content="/og.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>%WEB_TITLE%</title>
    <style id="expo-reset">
      html,
      body,
      #root {
        min-height: 100%;
        height: 100%;
        margin: 0;
        background: #faf9f5;
      }

      body {
        overflow: hidden;
        overscroll-behavior: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        display: flex;
        flex: 1;
      }

      * {
        box-sizing: border-box;
      }

      *:focus-visible {
        outline: 3px solid rgba(107, 70, 193, 0.38);
        outline-offset: 2px;
      }

      @media (prefers-color-scheme: dark) {
        html,
        body,
        #root {
          background: #121214;
        }
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run Semora.</noscript>
    <div id="root"></div>
  </body>
</html>
