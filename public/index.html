<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#6B46C1" />
    <meta name="application-name" content="Semora" />
    <meta
      name="description"
      content="Turn syllabi into an organized semester with deadlines, grades, study plans, flashcards, and focus tools."
    />
    <meta property="og:title" content="Semora · Your semester, organized" />
    <meta
      property="og:description"
      content="Scan a syllabus and turn every deadline into a plan."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Semora · Your semester, organized" />
    <meta
      name="twitter:description"
      content="Scan a syllabus and turn every deadline into a plan."
    />
    <meta name="twitter:image" content="/og.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>%WEB_TITLE%</title>
    <style id="expo-reset">
      html,
      body,
      #root {
        min-height: 100%;
        height: 100%;
        margin: 0;
        background: #faf9f5;
      }

      body {
        overflow: hidden;
        overscroll-behavior: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        display: flex;
        flex: 1;
      }

      * {
        box-sizing: border-box;
      }

      *:focus-visible {
        outline: 3px solid rgba(107, 70, 193, 0.38);
        outline-offset: 2px;
      }

      @media (prefers-color-scheme: dark) {
        html,
        body,
        #root {
          background: #121214;
        }
      }

      /* Desktop-browser polish: none of this changes layout, only feel. */
      ::selection {
        background: rgba(107, 70, 193, 0.24);
      }

      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background-color: rgba(107, 70, 193, 0.22);
        border-radius: 999px;
        border: 2px solid transparent;
        background-clip: content-box;
      }
      ::-webkit-scrollbar-thumb:hover {
        background-color: rgba(107, 70, 193, 0.38);
      }
      @media (prefers-color-scheme: dark) {
        ::-webkit-scrollbar-thumb {
          background-color: rgba(155, 122, 232, 0.28);
        }
        ::-webkit-scrollbar-thumb:hover {
          background-color: rgba(155, 122, 232, 0.44);
        }
      }
      * {
        scrollbar-width: thin;
        scrollbar-color: rgba(107, 70, 193, 0.28) transparent;
      }

      [role='button'],
      [role='link'] {
        transition: opacity 120ms ease, box-shadow 120ms ease, background-color 120ms ease;
      }
      [role='button']:hover,
      [role='link']:hover {
        opacity: 0.94;
      }

      /* Marketing homepage (app/welcome.tsx) hero glow — slow, subtle, not
         attention-grabbing enough to distract from the headline. */
      @keyframes semoraGlowPulse {
        0%, 100% { opacity: 0.55; transform: scale(1); }
        50% { opacity: 0.85; transform: scale(1.06); }
      }
      @keyframes semoraFloat {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      @media (prefers-reduced-motion: reduce) {
        [style*='semoraGlowPulse'], [style*='semoraFloat'] { animation: none !important; }
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run Semora.</noscript>
    <div id="root"></div>
  </body>
</html>
