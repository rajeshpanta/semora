<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Semora — App Store screenshots (Aurora)</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#f3eeff;color:#1c1b1f;font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;padding:44px 24px 64px;}
  h1{font-size:27px;font-weight:800;letter-spacing:-.6px;text-align:center;}
  p.sub{text-align:center;color:#7a6f97;margin-top:8px;font-size:15px;}
  .row{display:flex;gap:24px;overflow-x:auto;padding:36px 8px 24px;}
  .card{flex:0 0 auto;text-align:center;}
  .card img{width:268px;border-radius:28px;box-shadow:0 30px 70px rgba(90,50,160,0.28);display:block;}
  .lbl{margin-top:15px;font-size:13px;font-weight:800;color:#5a4b86;letter-spacing:.2px;}
  .num{display:inline-block;width:22px;height:22px;line-height:22px;border-radius:50%;background:#6B46C1;color:#fff;font-size:12px;margin-right:6px;}
  .hero{outline:3px solid #6B46C1;outline-offset:6px;border-radius:30px;}
  @media(min-width:1740px){.row{justify-content:center;}}
</style>
</head>
<body>
  <h1>Semora — new App Store screenshots · “Aurora Command Center”</h1>
  <p class="sub">iPhone 6.7" · 1284 × 2778 · upload-ready · screen 4 (Canvas) is the hero</p>
  <div class="row">
    <div class="card"><img src="01-scan.png"><div class="lbl"><span class="num">1</span>Scan · AI</div></div>
    <div class="card"><img src="02-today.png"><div class="lbl"><span class="num">2</span>Day, sorted</div></div>
    <div class="card"><img src="03-grades.png"><div class="lbl"><span class="num">3</span>Grade tracker</div></div>
    <div class="card"><img class="hero" src="04-canvas.png"><div class="lbl"><span class="num">4</span>Canvas auto-sync ★</div></div>
    <div class="card"><img src="05-calendar.png"><div class="lbl"><span class="num">5</span>Semester calendar</div></div>
    <div class="card"><img src="06-pro.png"><div class="lbl"><span class="num">6</span>Semora Pro</div></div>
  </div>
</body>
</html>
