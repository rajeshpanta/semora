<svg width="320" height="200" viewBox="0 0 320 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img">
  <defs>
    <linearGradient id="g8" x1="0" y1="0" x2="320" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B0764"/><stop offset="1" stop-color="#4C1D95"/>
    </linearGradient>
    <radialGradient id="o8" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(70 30) scale(180)">
      <stop stop-color="#C084FC" stop-opacity="0.5"/><stop offset="1" stop-color="#C084FC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="s8" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fff" stop-opacity="0.24"/><stop offset="1" stop-color="#fff" stop-opacity="0.07"/>
    </linearGradient>
    <filter id="b8" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="10"/></filter>
    <clipPath id="c8"><rect width="320" height="200" rx="12"/></clipPath>
  </defs>
    <style>
      .fl8 { transform-box: fill-box; transform-origin: center bottom;
             animation: f8 2.6s ease-in-out 0.6s infinite; }
      @keyframes f8 {
        0%,100% { transform: translateY(0) scale(1,1) }
        30%     { transform: translateY(-7px) scale(0.98,1.03) }
        60%     { transform: translateY(0) scale(1.03,0.97) }
        80%     { transform: translateY(-2px) scale(1,1) }
      }
      .wv8 { transform-box: fill-box; transform-origin: 0% 100%;
             animation: w8 1.1s ease-in-out 0.6s infinite; }
      @keyframes w8 { 0%,100% { transform: rotate(-4deg) } 50% { transform: rotate(20deg) } }
      .ey8 { transform-box: fill-box; transform-origin: center;
             animation: e8 4.2s ease-in-out 0.4s infinite; }
      @keyframes e8 { 0%,90%,100% { transform: scaleY(1) } 94% { transform: scaleY(0.1) } }
      /* The front card turns on its vertical axis — a flashcard flipping to
         its answer side, which is the whole subject of the post. */
      .flip8 { transform-box: fill-box; transform-origin: center;
               animation: p8 4.4s ease-in-out infinite; }
      @keyframes p8 { 0%,32% { transform: scaleX(1) } 44% { transform: scaleX(.04) } 56%,100% { transform: scaleX(1) } }
      .face8 { animation: a8 4.4s ease-in-out infinite; }
      @keyframes a8 { 0%,40% { opacity: 1 } 46%,100% { opacity: 0 } }
      .back8 { animation: k8 4.4s ease-in-out infinite; }
      @keyframes k8 { 0%,44% { opacity: 0 } 52%,100% { opacity: 1 } }
      .dr8 { animation: d8 4.4s ease-in-out infinite; }
      @keyframes d8 { 0%,52% { stroke-dashoffset: 26 } 68%,100% { stroke-dashoffset: 0 } }
      .pl8 { transform-box: fill-box; transform-origin: center;
             animation: l8 1.9s ease-in-out infinite; }
      @keyframes l8 { 0%,100% { opacity: .4; transform: scale(.85) } 50% { opacity: 1; transform: scale(1.12) } }
      @media (prefers-reduced-motion: reduce) {
        .fl8, .wv8, .ey8, .flip8, .face8, .back8, .dr8, .pl8 {
          animation: none; stroke-dashoffset: 0; opacity: 1; transform: none;
        }
        .back8 { opacity: 0 }
      }
    </style>
  <g clip-path="url(#c8)">
    <rect width="320" height="200" fill="url(#g8)"/>
    <rect width="320" height="200" fill="url(#o8)"/>
    <circle cx="196" cy="100" r="58" fill="#A78BFA" fill-opacity="0.24" filter="url(#b8)"/>

    <!-- Two cards behind, offset, so the stack reads as a deck not a page. -->
    <rect x="150" y="46" width="126" height="88" rx="14" fill="#fff" fill-opacity="0.08" stroke="#fff" stroke-opacity="0.14" transform="rotate(-7 213 90)"/>
    <rect x="156" y="52" width="126" height="88" rx="14" fill="#fff" fill-opacity="0.10" stroke="#fff" stroke-opacity="0.18" transform="rotate(-3 219 96)"/>

    <g class="flip8">
      <rect x="162" y="58" width="126" height="88" rx="14" fill="url(#s8)" stroke="#fff" stroke-opacity="0.36"/>
      <g class="face8">
        <rect x="178" y="78" width="60" height="6" rx="3" fill="#fff" fill-opacity="0.6"/>
        <rect x="178" y="94" width="94" height="6" rx="3" fill="#fff" fill-opacity="0.34"/>
        <rect x="178" y="110" width="72" height="6" rx="3" fill="#fff" fill-opacity="0.22"/>
      </g>
      <g class="back8">
        <circle cx="196" cy="102" r="14" fill="#FBBF24"/>
        <path class="dr8" d="M190 102 l4.5 4.5 8 -9" stroke="#2A1259" stroke-width="2.6"
          stroke-dasharray="26" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <rect x="218" y="92" width="54" height="6" rx="3" fill="#fff" fill-opacity="0.6"/>
        <rect x="218" y="106" width="38" height="6" rx="3" fill="#fff" fill-opacity="0.3"/>
      </g>
    </g>

    <circle class="pl8" cx="140" cy="52" r="5" fill="#FBBF24"/>
    <circle class="pl8" cx="298" cy="152" r="4" fill="#C084FC"/>

    <g transform="translate(76 106) scale(0.84)"><g class="fl8">
      <ellipse cx="0" cy="34" rx="24" ry="4.5" fill="#000" fill-opacity="0.13"/>
      <path d="M-24 -2 L-34 -20" stroke="#FFF6E6" stroke-width="7" stroke-linecap="round"/>
      <path class="wv8" d="M24 -2 L34 -20" stroke="#FFF6E6" stroke-width="7" stroke-linecap="round"/>
      <rect x="-26" y="-28" width="52" height="58" rx="24" fill="#FFF6E6"/>
      <ellipse cx="-16" cy="4" rx="6" ry="4" fill="#FBBF24" fill-opacity="0.5"/>
      <ellipse cx="16" cy="4" rx="6" ry="4" fill="#FBBF24" fill-opacity="0.5"/>
      <ellipse class="ey8" cx="-9" cy="-7" rx="4.2" ry="5.4" fill="#2A1259"/>
      <ellipse class="ey8" cx="9" cy="-7" rx="4.2" ry="5.4" fill="#2A1259"/>
      <path d="M-6 8 q6 6 12 0" stroke="#2A1259" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    </g></g>
  </g>
</svg>
