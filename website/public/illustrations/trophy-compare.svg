    <style>
      .fl3 { transform-box: fill-box; transform-origin: center bottom;
             animation: f3 2.6s ease-in-out 0.7s infinite; }
      @keyframes f3 {
        0%,100% { transform: translateY(0) scale(1,1) }
        30%     { transform: translateY(-7px) scale(0.98,1.03) }
