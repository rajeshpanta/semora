      @keyframes o3 { 0%,18% { transform: scale(0); opacity: 0 } 34%,100% { transform: scale(1); opacity: 1 } }
      .sw3 { animation: s3 4.2s linear infinite; }
      @keyframes s3 { 0% { stroke-dashoffset: 314 } 100% { stroke-dashoffset: 0 } }
      .sl3 { animation: l3 3.2s ease-in-out infinite; }
      @keyframes l3 { 0%,12% { transform: translateX(26px); opacity: 0 } 32%,100% { transform: translateX(0); opacity: 1 } }
      @media (prefers-reduced-motion: reduce) {
        .fl3, .wv3, .ey3, .pl3, .gr3, .dr3, .rp3, .pop3, .sw3, .sl3 {
          animation: none; stroke-dashoffset: 0; opacity: 1; transform: none;
        }
