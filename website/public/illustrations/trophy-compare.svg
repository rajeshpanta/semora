      .dr3 { animation: d3 3.4s ease-in-out infinite; }
      @keyframes d3 { 0% { stroke-dashoffset: 190 } 45%,100% { stroke-dashoffset: 0 } }
      .rp3 { transform-box: fill-box; transform-origin: center;
             animation: r3 2.6s ease-out infinite; }
      @keyframes r3 { 0% { transform: scale(.45); opacity: .7 } 100% { transform: scale(1.15); opacity: 0 } }
      .pop3 { transform-box: fill-box; transform-origin: center;
