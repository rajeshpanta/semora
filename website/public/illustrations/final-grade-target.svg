<svg width="320" height="200" viewBox="0 0 320 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img">
  <defs>
    <linearGradient id="g9" x1="0" y1="0" x2="320" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B0764"/><stop offset="1" stop-color="#4C1D95"/>
    </linearGradient>
    <radialGradient id="o9" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(240 180) scale(180)">
      <stop stop-color="#C084FC" stop-opacity="0.5"/><stop offset="1" stop-color="#C084FC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="s9" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fff" stop-opacity="0.22"/><stop offset="1" stop-color="#fff" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="b9" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="10"/></filter>
    <clipPath id="c9"><rect width="320" height="200" rx="12"/></clipPath>
  </defs>
    <style>
      .fl9 { transform-box: fill-box; transform-origin: center bottom;
             animation: f9 2.6s ease-in-out 0.6s infinite; }
      @keyframes f9 {
        0%,100% { transform: translateY(0) scale(1,1) }
        30%     { transform: translateY(-7px) scale(0.98,1.03) }
        60%     { transform: translateY(0) scale(1.03,0.97) }
        80%     { transform: translateY(-2px) scale(1,1) }
      }
      .wv9 { transform-box: fill-box; transform-origin: 0% 100%;
             animation: w9 1.1s ease-in-out 0.6s infinite; }
      @keyframes w9 { 0%,100% { transform: rotate(-4deg) } 50% { transform: rotate(20deg) } }
      .ey9 { transform-box: fill-box; transform-origin: center;
             animation: e9 4.2s ease-in-out 0.4s infinite; }
      @keyframes e9 { 0%,90%,100% { transform: scaleY(1) } 94% { transform: scaleY(0.1) } }
      /* The arc fills to the score you'd need, then holds — the answer the
         post is about, drawn rather than stated. */
      .arc9 { animation: a9 4.2s cubic-bezier(.33,1,.68,1) infinite; }
      @keyframes a9 { 0%,8% { stroke-dashoffset: 189 } 46%,100% { stroke-dashoffset: 55 } }
      .ndl9 { transform-box: fill-box; transform-origin: 50% 100%;
              animation: n9 4.2s cubic-bezier(.33,1.2,.68,1) infinite; }
      @keyframes n9 { 0%,8% { transform: rotate(-72deg) } 46%,100% { transform: rotate(34deg) } }
      .pop9 { transform-box: fill-box; transform-origin: center;
              animation: p9 4.2s cubic-bezier(.34,1.6,.5,1) infinite; }
      @keyframes p9 { 0%,34% { transform: scale(0); opacity: 0 } 50%,100% { transform: scale(1); opacity: 1 } }
      .rw9 { transform-box: fill-box; transform-origin: 0% 50%;
             animation: r9 4.2s cubic-bezier(.34,1.3,.5,1) infinite; }
      .rw9.d1 { animation-delay: .12s }
      .rw9.d2 { animation-delay: .24s }
      @keyframes r9 { 0%,10% { transform: scaleX(.1); opacity: .3 } 38%,100% { transform: scaleX(1); opacity: 1 } }
      @media (prefers-reduced-motion: reduce) {
        .fl9, .wv9, .ey9, .arc9, .ndl9, .pop9, .rw9 {
          animation: none; stroke-dashoffset: 55; opacity: 1; transform: none;
        }
      }
    </style>
  <g clip-path="url(#c9)">
    <rect width="320" height="200" fill="url(#g9)"/>
    <rect width="320" height="200" fill="url(#o9)"/>
    <circle cx="216" cy="98" r="60" fill="#FBBF24" fill-opacity="0.18" filter="url(#b9)"/>

    <!-- The weight rows: the inputs the gauge is computed from. -->
    <rect x="26" y="30" width="104" height="58" rx="12" fill="#fff" fill-opacity="0.09" stroke="#fff" stroke-opacity="0.18"/>
    <rect class="rw9" x="38" y="42" width="52" height="5" rx="2.5" fill="#fff" fill-opacity="0.5"/>
    <rect class="rw9 d1" x="38" y="55" width="72" height="5" rx="2.5" fill="#fff" fill-opacity="0.3"/>
    <rect class="rw9 d2" x="38" y="68" width="40" height="5" rx="2.5" fill="#fff" fill-opacity="0.2"/>

    <!-- The gauge: a semicircle from 0 to 100. -->
    <g transform="translate(216 122)">
      <path d="M-60 0 a60 60 0 0 1 120 0" stroke="#fff" stroke-opacity="0.16" stroke-width="12" stroke-linecap="round" fill="none"/>
      <path class="arc9" d="M-60 0 a60 60 0 0 1 120 0" stroke="#FBBF24" stroke-width="12"
        stroke-linecap="round" stroke-dasharray="189" stroke-dashoffset="189" fill="none"/>
      <g class="ndl9">
        <path d="M0 4 L0 -40" stroke="#FFF6E6" stroke-width="5" stroke-linecap="round"/>
      </g>
      <circle cx="0" cy="4" r="8" fill="#FFF6E6"/>
      <rect x="-30" y="20" width="60" height="5" rx="2.5" fill="#fff" fill-opacity="0.3"/>
      <rect x="-18" y="33" width="36" height="5" rx="2.5" fill="#fff" fill-opacity="0.18"/>
    </g>

    <g class="pop9">
      <rect x="248" y="34" width="46" height="28" rx="9" fill="#FBBF24"/>
      <rect x="257" y="45" width="28" height="6" rx="3" fill="#2A1259" fill-opacity="0.75"/>
    </g>

    <g transform="translate(78 128) scale(0.8)"><g class="fl9">
      <ellipse cx="0" cy="34" rx="24" ry="4.5" fill="#000" fill-opacity="0.13"/>
      <path d="M-24 -2 L-34 -20" stroke="#FFF6E6" stroke-width="7" stroke-linecap="round"/>
      <path class="wv9" d="M24 -2 L34 -20" stroke="#FFF6E6" stroke-width="7" stroke-linecap="round"/>
      <rect x="-26" y="-28" width="52" height="58" rx="24" fill="#FFF6E6"/>
      <ellipse cx="-16" cy="4" rx="6" ry="4" fill="#FBBF24" fill-opacity="0.5"/>
      <ellipse cx="16" cy="4" rx="6" ry="4" fill="#FBBF24" fill-opacity="0.5"/>
      <ellipse class="ey9" cx="-9" cy="-7" rx="4.2" ry="5.4" fill="#2A1259"/>
      <ellipse class="ey9" cx="9" cy="-7" rx="4.2" ry="5.4" fill="#2A1259"/>
      <path d="M-6 8 q6 6 12 0" stroke="#2A1259" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    </g></g>
  </g>
</svg>
