      .sl5 { animation: l5 3.2s ease-in-out infinite; }
      @keyframes l5 { 0%,12% { transform: translateX(26px); opacity: 0 } 32%,100% { transform: translateX(0); opacity: 1 } }
      @media (prefers-reduced-motion: reduce) {
