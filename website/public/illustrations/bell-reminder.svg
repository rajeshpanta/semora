      @keyframes o4 { 0%,18% { transform: scale(0); opacity: 0 } 34%,100% { transform: scale(1); opacity: 1 } }
      .sw4 { animation: s4 4.2s linear infinite; }
      @keyframes s4 { 0% { stroke-dashoffset: 314 } 100% { stroke-dashoffset: 0 } }
      .sl4 { animation: l4 3.2s ease-in-out infinite; }
      @keyframes l4 { 0%,12% { transform: translateX(26px); opacity: 0 } 32%,100% { transform: translateX(0); opacity: 1 } }
      @media (prefers-reduced-motion: reduce) {
        .fl4, .wv4, .ey4, .pl4, .gr4, .dr4, .rp4, .pop4, .sw4, .sl4 {
          animation: none; stroke-dashoffset: 0; opacity: 1; transform: none;
        }
      }
    </style>
