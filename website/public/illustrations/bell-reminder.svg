      <rect x="202" y="65" width="46" height="5" rx="2.5" fill="#fff" fill-opacity="0.3"/>
    </g>
    <g opacity="0.5" class="sl4" style="animation-delay:0.22s">
      <rect x="178" y="86" width="106" height="28" rx="10" fill="#fff" fill-opacity="0.09" stroke="#fff" stroke-opacity="0.16"/>
